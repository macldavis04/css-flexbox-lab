<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <div class="header">
      <span class="online">ONLINE</span>
      <div class="avatar"></div>
      <h2>John Shoshone</h2>
    </div>

    <div class="rating">
      <img src="https://i.imgur.com/iUpkmhs.png" alt="4 of 5 stars" class="stars">
      <p>Psychic Healer</p>
    </div>

    <div class="pricing">
      <p><strong>5 mins free</strong></p>
      <p>then $5.99/min</p>
    </div>

    <div class="buttons">
      <div class="call"></div>
      <div class="chat"></div>
    </div>
  </div>

</body>
</html>
